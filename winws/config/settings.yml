# ═══════════════════════════════════════════════════════════════
#  ТЕСТИРОВАНИЕ
# ═══════════════════════════════════════════════════════════════
MinScore:           "1"
MinScorePercent:    "0"
TopN:               "20"
TargetScore:        "0"
AutoStopOnPerfect:  "True"
KeepAllWorking:     "True"
TestDepth:          "2"
BinDepth:           "1"

# ═══════════════════════════════════════════════════════════════
#  ПРЕ-ТЕСТ
# ═══════════════════════════════════════════════════════════════
