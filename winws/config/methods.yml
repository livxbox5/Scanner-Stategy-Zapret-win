# ═══════════════════════════════════════════════════════════════
#  WINDIVERT ФИЛЬТРЫ
# ═══════════════════════════════════════════════════════════════
WfTcp:               "80,443"
WfUdp:               "443,50000-65535,25565,19132"
FilterL7:            ""
WfIface:             "0"
WfL3:                "ipv4"
UseIpsetExclude:     "True"
UseHostlistExclude:  "True"
#Debug: "False"

# ═══════════════════════════════════════════════════════════════
#  RAWS (WinDivert filter для --wf-raw-part, v72+)
# ═══════════════════════════════════════════════════════════════
WfRawPart_QUIC:      "udp.DstPort == 443"
WfRawPart_STUN:      "udp.DstPort == 3478 or udp.DstPort == 5349"
WfRawPart_WireGuard: "udp.DstPort == 51820"
WfRawPart_Discord:   "udp.DstPort >= 50000 and udp.DstPort <= 50100"